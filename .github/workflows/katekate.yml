name: Sync Event

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-bigmatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Checkout Private Core Scraper
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.GH_PAT }}
          path: private_core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow firebase-admin

      - name: Process Bigmatch Events
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID || '-BEINARAB' }}
          CATEGORY_NAME: ${{ secrets.CATEGORY_NAME || 'EVENT ARAB' }}
          CATEGORY_ORDER: ${{ secrets.CATEGORY_ORDER || '4' }}
        run: |
          if [ -f "private_core/kate.py" ]; then
            python private_core/kate.py
          else
            python kate.py
          fi
